[package]
name = "pometry-shacl"
version.workspace = true
readme = "README.md"
authors.workspace = true
description = "Pometry's fork of rudof's shacl: A SHACL validator for RDF data, implemented in Rust."
documentation = "https://docs.rs/pometry-shacl"
edition.workspace = true
license.workspace = true
homepage = "https://github.com/Pometry/rudof"
repository = "https://github.com/Pometry/rudof"

[lib]
name = "shacl"

[features]
default = ["sparql"]
sparql = ["dep:sparql_service", "sparql_service/sparql", "rudof_rdf/sparql", "dep:oxrdf"]

[dependencies]
anyhow.workspace = true
dashmap.workspace = true
either.workspace = true
indoc.workspace = true
itertools.workspace = true
petgraph.workspace = true
prefixmap.workspace = true
rayon.workspace = true
rudof_rdf.workspace = true
rudof_config.workspace = true
oxrdf = { workspace = true, optional = true }
rudof_iri.workspace = true
rudof_typing.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
sparql_service = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker.workspace = true

[dev-dependencies]
oxrdf = { workspace = true, features = ["oxsdatatypes"] }

[[example]]
name = "endpoint_validation"
required-features = ["sparql"]

[[test]]
name = "shacl_testsuite"
required-features = ["sparql"]
