[package]
name = "pometry-rudof_iri"
version.workspace = true
authors.workspace = true
description = "Pometry's fork of rudof's rudof_iri: RDF and Knowledge Graphs processing tool"
documentation = "https://docs.rs/pometry-rudof_iri"
edition.workspace = true
license.workspace = true
homepage = "https://github.com/Pometry/rudof"
repository = "https://github.com/Pometry/rudof"

[lib]
name = "rudof_iri"

[dependencies]
getrandom.workspace = true
indexmap.workspace = true
oxiri.workspace = true
oxrdf.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
proptest.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
reqwest.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
